server:
  port: 8081

spring:
  application:
    name: lingnong-user

  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/linglong?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: your-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: your-password
      database: 0
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lingnong.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 短信验证码配置
user:
  sms:
    code-expire: 300
    resend-interval: 60

# 日志配置
logging:
  level:
    com.lingnong.user: DEBUG
