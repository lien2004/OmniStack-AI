server:
  port: 8083

spring:
  application:
    name: linglong-mcp-server
  
  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/linglong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: your-password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# LLM配置（用于智能图表生成）
llm:
  api-key: ${ZHIPU_API_KEY:}
  api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  model: glm-4.6

# 日志配置
logging:
  level:
    com.linglong.mcp: DEBUG
