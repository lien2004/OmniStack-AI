server:
  port: 8080

spring:
  application:
    name: linglong-gateway
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: your-password
      database: 2
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cloud:
    gateway:
      routes:
        # ==========================================
        # 1. 用户与认证服务 (User & Auth)
        # 端口: 8082
        # 匹配: /api/user/** 和 /api/auth/**
        # ==========================================
        - id: linglong-user
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**, /api/auth/**
          filters:
            - StripPrefix=1

        # ==========================================
        # 2. Agent 服务
        # 端口: 8085
        # 匹配: /api/agent/** 和 /api/v1/agents/**
        # ==========================================
        - id: linglong-agent
          uri: http://localhost:8085
          predicates:
            - Path=/api/agent/**, /api/v1/agents/**
          filters:
            - StripPrefix=1

        # ==========================================
        # 3. LLM Core 服务
        # 端口: 8084
        # 匹配: /ai/**
        # ==========================================
        - id: linglong-llm-core
          uri: http://localhost:8084
          predicates:
            - Path=/ai/**
          filters:
            - StripPrefix=1

        # ==========================================
        # 4. MCP 服务
        # 端口: 8083
        # 匹配: /api/v1/mcp/**
        # ==========================================
        - id: linglong-mcp
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/mcp/**
          filters:
            - StripPrefix=1

      # 跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# JWT配置 - 生产环境请务必修改 secret
jwt:
  secret: your-secret-key-here-change-this
  expiration: 86400000
  tokenHeader: Authorization

# 限流配置
rate-limiter:
  enabled: true
  default-rate: 100
  default-burst: 200

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO