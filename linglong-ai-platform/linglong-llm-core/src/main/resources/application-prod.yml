spring:
  # PostgreSQL数据库配置 - 宝塔生产环境
  datasource:
    url: jdbc:postgresql://localhost:5432/linglongpg
    username: linglongpg
    password: your-password
    driver-class-name: org.postgresql.Driver

  # Redis配置 - 宝塔生产环境
  data:
    redis:
      host: localhost
      port: 6379
      password: your-password
      database: 1
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MySQL配置 - 宝塔生产环境（对话历史持久化）
chat:
  datasource:
    url: jdbc:mysql://localhost:3306/linglong?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: linglong
    password: your-password
    driver-class-name: com.mysql.cj.jdbc.Driver

# MCP Server 配置 - 生产环境端口保持一致
mcp:
  server:
    url: http://localhost:8083

# 日志配置 - 生产环境
logging:
  level:
    com.linglong.llm: INFO
    org.springframework.ai: WARN
    org.springframework.data.redis: WARN
  file:
    name: /www/wwwlogs/linglong-llm-core/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
