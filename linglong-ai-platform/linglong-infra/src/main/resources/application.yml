spring:
  application:
    name: linglong-infra
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: your-password
      database: 0
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/linglong
    username: postgres
    password: your-password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# MinIO配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: linglong-files

# Git配置
git:
  base-path: ./repos

# 日志配置
logging:
  level:
    com.linglong.infra: DEBUG
    org.springframework.data.redis: DEBUG
